<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VegaPharm CRM</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background-color: var(--tg-theme-bg-color, #f5f5f7);
            color: var(--tg-theme-text-color, #333333);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .login-container {
            background: #ffffff;
            padding: 35px 25px;
            border-radius: 20px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            width: 100%;
            max-width: 360px;
            text-align: center;
        }
        .logo {
            font-size: 26px;
            font-weight: 800;
            color: #1a73e8;
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }
        .subtitle {
            font-size: 13px;
            color: #888888;
            margin-bottom: 30px;
            font-weight: 500;
        }
        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }
        .input-group label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: #444444;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .input-group input {
            width: 100%;
            padding: 14px 16px;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            font-size: 16px;
            outline: none;
            background-color: #f8fafc;
            transition: all 0.2s ease;
        }
        .input-group input:focus {
            border-color: #1a73e8;
            background-color: #ffffff;
            box-shadow: 0 0 0 3px rgba(26, 115, 232, 0.1);
        }
        .btn-login {
            width: 100%;
            padding: 15px;
            background-color: #1a73e8;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
            transition: background-color 0.2s ease;
        }
        .btn-login:active {
            background-color: #155cb4;
        }
        .error-msg {
            color: #d93025;
            font-size: 13px;
            margin-top: 14px;
            display: none;
            font-weight: 500;
        }
        /* Стили для будущей админки (скрыты по умолчанию) */
        .admin-panel {
            display: none;
            width: 100%;
            text-align: left;
        }
        .admin-panel h2 {
            font-size: 20px;
            margin-bottom: 15px;
            color: #111827;
        }
    </style>
</head>
<body>

<div class="login-container" id="loginBlock">
    <div class="logo">VegaPharm</div>
    <div class="subtitle">Система управления (CRM)</div>
    
    <div class="input-group">
        <label for="username">Логин</label>
        <input type="text" id="username" placeholder="Введите логин..." autocomplete="off">
    </div>
    
    <div class="input-group">
        <label for="password">Пароль</label>
        <input type="password" id="password" placeholder="Введите пароль...">
    </div>
    
    <button class="btn-login" onclick="handleLogin()">Войти в систему</button>
    <div class="error-msg" id="errorBlock">Неверный логин или пароль</div>
</div>

<div class="login-container admin-panel" id="adminBlock">
    <div class="logo" style="font-size: 20px;">Панель Администратора</div>
    <div class="subtitle">Управление медпредставителями</div>
    <h2 style="font-size: 16px; margin-bottom: 20px; color:#444;">Добро пожаловать, Директор!</h2>
    
    <p style="font-size: 14px; color: #666; background: #f0f7ff; padding: 15px; border-radius: 8px; border-left: 4px solid #1a73e8;">
