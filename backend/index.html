<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VegaPharm CRM</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background-color: var(--tg-theme-bg-color, #f5f5f7);
            color: var(--tg-theme-text-color, #333333);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 15px;
        }
        .container {
            background: #ffffff;
            padding: 30px 25px;
            border-radius: 20px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            width: 100%;
            max-width: 380px;
        }
        .text-center { text-align: center; }
        .logo {
            font-size: 26px;
            font-weight: 800;
            color: #1a73e8;
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }
        .subtitle {
            font-size: 13px;
            color: #888888;
            margin-bottom: 30px;
            font-weight: 500;
        }
        .input-group {
            margin-bottom: 18px;
            text-align: left;
        }
        .input-group label {
            display: block;
            font-size: 11px;
            font-weight: 600;
            color: #444444;
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .input-group input, .input-group select {
            width: 100%;
            padding: 13px 16px;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            font-size: 15px;
            outline: none;
            background-color: #f8fafc;
            transition: all 0.2s ease;
        }
        .input-group input:focus, .input-group select:focus {
            border-color: #1a73e8;
            background-color: #ffffff;
            box-shadow: 0 0 0 3px rgba(26, 115, 232, 0.1);
        }
        .btn {
            width: 100%;
            padding: 15px;
            background-color: #1a73e8;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
            transition: background-color 0.2s ease;
        }
        .btn:active {
            background-color: #155cb4;
        }
        .error-msg {
            color: #d93025;
            font-size: 13px;
            margin-top: 14px;
            display: none;
            font-weight: 500;
        }
        .success-msg {
            color: #1e7e34;
            font-size: 13px;
            margin-top: 14px;
            display: none;
            font-weight: 500;
            background: #e6f4ea;
            padding: 12px;
            border-radius: 10px;
        }
        #adminBlock {
            display: none;
        }
    </style>
</head>
<body>

<div class="container text-center" id="loginBlock">
    <div class="logo">VegaPharm</div>
    <div class="subtitle">Система управления (CRM)</div>
    
    <div class="input-group">
        <label for="username">Логин</label>
        <input type="text" id="username" placeholder="Введите логин..." autocomplete="off">
    </div>
    
    <div class="input-group">
        <label for="password">Пароль</label>
        <input type="password" id="password" placeholder="Введите пароль...">
    </div>
    
    <button class="btn" onclick="handleLogin()">Войти в систему</button>
    <div class="error-msg" id="errorBlock">Неверный логин или пароль</div>
</div>

<div class="container" id="adminBlock">
    <div class="text-center">
        <div class="logo" style="font-size: 22px;">Админ-Панель</div>
        <div class="subtitle" style="margin-bottom: 25px;">Регистрация медпредставителей</div>
    </div>
    
    <div class="input-group">
        <label for="repName">ФИО Сотрудника</label>
        <input type="text" id="repName" placeholder="Иванов Александр Петрович">
    </div>

    <div class="input-group">
        <label for="repLogin">Создать Логин</label>
        <input type="text" id="repLogin" placeholder="Например: alex_ivanov" autocomplete="off">
    </div>

    <div class="input-group">
        <label for="repPass">Создать Пароль</label>
        <input type="text" id="repPass" placeholder="Минимум 6 символов">
    </div>

    <div class="input-group">
        <label for="repGroup">Назначить продукцию / группу</label>
        <select id="repGroup">
            <option value="Кардиология">Кардиология</option>
            <option value="Гастроэнтерология">Гастроэнтерология</option>
            <option value="Педиатрия">Педиатрия</option>
            <option value="Неврология">Неврология</option>
        </select>
    </div>

    <button class="btn" style="background-color: #28a745;" onclick="createRepresentative()">Создать представителя</button>
    
    <div class="success-msg text-center" id="successBlock">Сотрудник успешно добавлен в базу данных!</div>
    <div class="error-msg text-center" id="adminErrorBlock">Заполните все поля формы.</div>
</div>

<script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    function handleLogin() {
        // Убираем случайные пробелы и переводим в нижний регистр для защиты от ошибок на смартфонах
        const userInp = document.getElementById('username').value.trim().toLowerCase();
        const passInp = document.getElementById('password').value.trim();
        const errorBlock = document.getElementById('errorBlock');
        
        errorBlock.style.display = 'none';

        // Жесткая проверка администратора (теперь admin сработает в любом регистре)
        if (userInp === "admin" && passInp === "vegapresident") {
            document.getElementById('loginBlock').style.display = 'none';
            document.getElementById('adminBlock').style.display = 'block';
        } else {
            errorBlock.style.display = 'block';
        }
    }

    function createRepresentative() {
        const name = document.getElementById('repName').value.trim();
        const login = document.getElementById('repLogin').value.trim();
        const pass = document.getElementById('repPass').value.trim();
        const group = document.getElementById('repGroup').value;
        
        const successBlock = document.getElementById('successBlock');
        const errorBlock = document.getElementById('adminErrorBlock');
        
        successBlock.style.display = 'none';
        errorBlock.style.display = 'none';

        if (!name || !login || !pass) {
            errorBlock.textContent = "Заполните все поля формы!";
            errorBlock.style.display = 'block';
            return;
        }

        // Отправка POST-запроса на бэкенд
        fetch('/api/create-user', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name, login, pass, group })
        })
        .then(res => {
            if (res.ok) {
                successBlock.style.display = 'block';
                // Очистка полей после успешной отправки
                document.getElementById('repName').value = '';
                document.getElementById('repLogin').value = '';
                document.getElementById('repPass').value = '';
            } else {
                errorBlock.textContent = "Ошибка сервера. Проверьте подключение к базе.";
                errorBlock.style.display = 'block';
            }
        })
        .catch(() => {
            errorBlock.textContent = "Ошибка сети. Сервер не ответил.";
            errorBlock.style.display = 'block';
        });
    }
</script>
</body>
</html>
